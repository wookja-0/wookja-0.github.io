<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="'Segoe UI','Apple SD Gothic Neo',sans-serif">
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Blue/Green 배포 흐름</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#64748b">새 버전을 전체 준비한 뒤 한번에 전환 — 이전 버전은 잠시 유지</text>

  <!-- legend -->
  <rect x="300" y="84" width="14" height="14" rx="3" fill="#3b82f6"/>
  <text x="320" y="96" font-size="12" fill="#475569">Blue (v1)</text>
  <rect x="410" y="84" width="14" height="14" rx="3" fill="#16a34a"/>
  <text x="430" y="96" font-size="12" fill="#475569">Green (v3)</text>

  <!-- 3 panels -->
  <!-- Panel 1: 배포 전 -->
  <g transform="translate(30,120)">
    <rect width="250" height="200" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="125" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">① 배포 전</text>
    <rect x="30" y="48" width="90" height="34" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text x="75" y="70" text-anchor="middle" font-size="12" fill="#475569">active</text>
    <rect x="30" y="120" width="90" height="40" rx="6" fill="#3b82f6"/>
    <text x="75" y="145" text-anchor="middle" font-size="12" fill="#fff">Blue v1</text>
    <path d="M75 82 L75 118" stroke="#1e293b" stroke-width="2" marker-end="url(#ar)"/>
    <text x="190" y="70" text-anchor="middle" font-size="11" fill="#94a3b8">preview</text>
    <text x="190" y="145" text-anchor="middle" font-size="11" fill="#cbd5e1">(없음)</text>
    <text x="125" y="186" text-anchor="middle" font-size="11" fill="#64748b">모든 트래픽 → v1</text>
  </g>

  <!-- Panel 2: 새 버전 배포 -->
  <g transform="translate(325,120)">
    <rect width="250" height="200" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="125" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">② 새 버전 배포</text>
    <rect x="30" y="48" width="90" height="34" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text x="75" y="70" text-anchor="middle" font-size="12" fill="#475569">active</text>
    <rect x="30" y="120" width="90" height="40" rx="6" fill="#3b82f6"/>
    <text x="75" y="145" text-anchor="middle" font-size="12" fill="#fff">Blue v1</text>
    <path d="M75 82 L75 118" stroke="#1e293b" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="135" y="48" width="90" height="34" rx="6" fill="#fff" stroke="#16a34a"/>
    <text x="180" y="70" text-anchor="middle" font-size="12" fill="#16a34a">preview</text>
    <rect x="135" y="120" width="90" height="40" rx="6" fill="#16a34a"/>
    <text x="180" y="145" text-anchor="middle" font-size="12" fill="#fff">Green v3</text>
    <path d="M180 82 L180 118" stroke="#16a34a" stroke-width="2" marker-end="url(#arg)"/>
    <text x="125" y="186" text-anchor="middle" font-size="11" fill="#64748b">라이브는 v1, v3는 preview로 검증</text>
  </g>

  <!-- Panel 3: promote -->
  <g transform="translate(620,120)">
    <rect width="250" height="200" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="125" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">③ Promote (전환)</text>
    <rect x="30" y="48" width="90" height="34" rx="6" fill="#fff" stroke="#16a34a"/>
    <text x="75" y="70" text-anchor="middle" font-size="12" fill="#16a34a">active</text>
    <rect x="30" y="120" width="90" height="40" rx="6" fill="#16a34a"/>
    <text x="75" y="145" text-anchor="middle" font-size="12" fill="#fff">Green v3</text>
    <path d="M75 82 L75 118" stroke="#16a34a" stroke-width="2" marker-end="url(#arg)"/>
    <rect x="135" y="120" width="90" height="40" rx="6" fill="#cbd5e1"/>
    <text x="180" y="140" text-anchor="middle" font-size="10" fill="#64748b">Blue v1</text>
    <text x="180" y="154" text-anchor="middle" font-size="9" fill="#94a3b8">scaleDown 대기</text>
    <text x="125" y="186" text-anchor="middle" font-size="11" fill="#047857">트래픽 한번에 → v3</text>
  </g>

  <!-- between-panel arrows -->
  <g fill="#94a3b8">
    <path d="M283 220 l30 0 l0 -7 l13 10 l-13 10 l0 -7 l-30 0 z"/>
    <path d="M578 220 l30 0 l0 -7 l13 10 l-13 10 l0 -7 l-30 0 z"/>
  </g>
  <text x="298" y="208" text-anchor="middle" font-size="10" fill="#64748b">set image</text>
  <text x="593" y="208" text-anchor="middle" font-size="10" fill="#16a34a">promote</text>

  <text x="450" y="346" text-anchor="middle" font-size="12" fill="#dc2626">⟲ 전환 후 scaleDownDelay 동안 Blue 유지 → 문제 시 즉시 롤백</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#1e293b"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
