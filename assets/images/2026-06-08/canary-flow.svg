<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="'Segoe UI','Apple SD Gothic Neo',sans-serif">
  <rect width="900" height="340" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Canary 배포 흐름</text>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#64748b">트래픽을 단계적으로 이동 — 각 단계마다 메트릭 분석 후 진행</text>

  <!-- legend -->
  <rect x="300" y="84" width="14" height="14" rx="3" fill="#3b82f6"/>
  <text x="320" y="96" font-size="12" fill="#475569">stable (v1)</text>
  <rect x="410" y="84" width="14" height="14" rx="3" fill="#ef4444"/>
  <text x="430" y="96" font-size="12" fill="#475569">canary (v3)</text>

  <!-- stages -->
  <g>
    <!-- positions: 4 cards -->
    <!-- card template width 170, height 150, y=130 -->
    <!-- Step 1 -->
    <g transform="translate(30,130)">
      <rect width="170" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="85" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Step 1</text>
      <rect x="20" y="44" width="130" height="22" rx="4" fill="#3b82f6"/>
      <rect x="137" y="44" width="13" height="22" rx="0" fill="#ef4444"/>
      <text x="85" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">10%</text>
      <text x="85" y="116" text-anchor="middle" font-size="11" fill="#64748b">canary로 10%</text>
      <text x="85" y="134" text-anchor="middle" font-size="11" fill="#64748b">분석 시작</text>
    </g>
    <!-- Step 2 -->
    <g transform="translate(245,130)">
      <rect width="170" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="85" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Step 2</text>
      <rect x="20" y="44" width="91" height="22" rx="4" fill="#3b82f6"/>
      <rect x="111" y="44" width="39" height="22" fill="#ef4444"/>
      <text x="85" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">30%</text>
      <text x="85" y="116" text-anchor="middle" font-size="11" fill="#64748b">성공률 95%+</text>
      <text x="85" y="134" text-anchor="middle" font-size="11" fill="#64748b">통과 → 증가</text>
    </g>
    <!-- Step 3 -->
    <g transform="translate(460,130)">
      <rect width="170" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="85" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Step 3</text>
      <rect x="20" y="44" width="52" height="22" rx="4" fill="#3b82f6"/>
      <rect x="72" y="44" width="78" height="22" fill="#ef4444"/>
      <text x="85" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">60%</text>
      <text x="85" y="116" text-anchor="middle" font-size="11" fill="#64748b">성공률 95%+</text>
      <text x="85" y="134" text-anchor="middle" font-size="11" fill="#64748b">통과 → 증가</text>
    </g>
    <!-- Step 4 -->
    <g transform="translate(675,130)">
      <rect width="170" height="150" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
      <text x="85" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">완료</text>
      <rect x="20" y="44" width="130" height="22" rx="4" fill="#ef4444"/>
      <text x="85" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">100%</text>
      <text x="85" y="116" text-anchor="middle" font-size="11" fill="#64748b">canary가</text>
      <text x="85" y="134" text-anchor="middle" font-size="11" fill="#64748b">stable로 승격</text>
    </g>

    <!-- arrows between cards -->
    <g fill="#94a3b8">
      <path d="M205 205 l28 0 l0 -6 l12 9 l-12 9 l0 -6 l-28 0 z"/>
      <path d="M420 205 l28 0 l0 -6 l12 9 l-12 9 l0 -6 l-28 0 z"/>
      <path d="M635 205 l28 0 l0 -6 l12 9 l-12 9 l0 -6 l-28 0 z"/>
    </g>
    <text x="219" y="196" text-anchor="middle" font-size="10" fill="#16a34a">✓</text>
    <text x="434" y="196" text-anchor="middle" font-size="10" fill="#16a34a">✓</text>
    <text x="649" y="196" text-anchor="middle" font-size="10" fill="#16a34a">✓</text>
  </g>

  <!-- rollback note -->
  <text x="450" y="318" text-anchor="middle" font-size="12" fill="#dc2626">⟲ 어느 단계에서든 에러율이 높으면 자동 rollback</text>
</svg>
