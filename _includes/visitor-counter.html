<!-- Visitor Counter Component - 사이드바 하단에 삽입 -->
{% assign goatcounter_id = site.analytics.goatcounter.id | default: '' %}
<style>
.visitor-counter {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin: 8px 0;
  padding: 6px 12px;
  font-size: 12px;
  color: var(--bs-body-color);
  opacity: 0.8;
  width: 100%;
  text-align: center;
}

.visitor-counter .vc-label {
  font-size: 11px;
  color: var(--bs-text-muted);
  font-weight: 500;
}

.visitor-counter .vc-number {
  font-family: 'SFMono-Regular', 'Consolas', 'Courier New', monospace;
  font-weight: 600;
  font-size: 13px;
  color: var(--bs-body-color);
  min-width: 24px;
  text-align: center;
}

.visitor-counter .vc-divider {
  color: var(--bs-border-color);
  margin: 0 2px;
  font-size: 10px;
}

/* Dark mode support */
[data-theme="dark"] .visitor-counter {
  color: var(--bs-body-color);
}

[data-theme="dark"] .visitor-counter .vc-label {
  color: var(--bs-text-muted);
}

[data-theme="dark"] .visitor-counter .vc-number {
  color: var(--bs-body-color);
}
</style>
<script>
// GoatCounter siteId를 전역 변수로 설정 (HTML 압축 영향 없음)
window.GOATCOUNTER_SITE_ID = '{{ goatcounter_id }}';
</script>
<script defer src="{{ '/assets/js/visitor-counter.js' | relative_url }}"></script>
